<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertes Atelier</title>

<style>
*{box-sizing:border-box}

body{
  font-family: Inter, system-ui, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  background:transparent;
}

.widget{
  width:420px;
  max-width:100%;
  padding:18px;
  border-radius:20px;
  border:1px solid rgba(0,0,0,0.08);
  background:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  font-weight:600;
}

.card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  margin-bottom:10px;
}

.left{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:0;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:0 0 auto;
}

.red{background:#e5484d;}
.orange{background:#f5a524;}
.green{background:#30a46c;}

.title{
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sub{
  font-size:12px;
  color:#666;
}

button{
  border:1px solid rgba(0,0,0,0.1);
  background:white;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  flex:0 0 auto;
}

.form{
  display:grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap:8px;
  margin-top:12px;
}

.form-bottom{
  display:grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap:8px;
}

input,select{
  width:100%;
  min-width:0;
  padding:8px 10px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.1);
  background:white;
}

.small{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

.empty{
  font-size:13px;
  color:#777;
  padding:10px 2px;
}

@media (max-width: 430px){
  .widget{
    width:100%;
  }
  .card{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="widget">

  <div class="header">
    <div>⚠️ Alertes atelier</div>
    <div id="count">0</div>
  </div>

  <div id="list"></div>

  <div class="form">
    <input id="vehicule" placeholder="Véhicule">
    <input id="alerte" placeholder="Alerte">
    <div class="form-bottom">
      <select id="priorite">
        <option>🔴 Urgent</option>
        <option>🟠 Important</option>
        <option>🟢 Normal</option>
      </select>
      <button onclick="add()">Ajouter</button>
    </div>
  </div>

  <div class="small">Les alertes sont enregistrées dans Notion.</div>

</div>

<script>
const list = document.getElementById("list")
const count = document.getElementById("count")

function color(priority){
  if(priority.includes("Urgent")) return "red"
  if(priority.includes("Important")) return "orange"
  return "green"
}

async function load(){
  const res = await fetch("/.netlify/functions/alertes")
  const data = await res.json()

  count.textContent = data.length + (data.length > 1 ? " actives" : " active")

  if(!data.length){
    list.innerHTML = "<div class='empty'>Aucune alerte en cours</div>"
    return
  }

  list.innerHTML = data.map(a => `
    <div class="card">
      <div class="left">
        <div class="dot ${color(a.priorite)}"></div>
        <div>
          <div class="title">${a.vehicule} — ${a.alerte}</div>
          <div class="sub">${a.priorite} • ${a.date}</div>
        </div>
      </div>
      <button onclick="resolve('${a.id}')">Réglé</button>
    </div>
  `).join("")
}

async function resolve(id){
  await fetch("/.netlify/functions/resolve",{
    method:"POST",
    body:JSON.stringify({id})
  })
  load()
}

async function add(){
  const vehicule = document.getElementById("vehicule").value.trim()
  const alerte = document.getElementById("alerte").value.trim()
  const priorite = document.getElementById("priorite").value

  if(!vehicule || !alerte) return

  await fetch("/.netlify/functions/add",{
    method:"POST",
    body:JSON.stringify({vehicule,alerte,priorite})
  })

  document.getElementById("vehicule").value = ""
  document.getElementById("alerte").value = ""
  document.getElementById("priorite").value = "🔴 Urgent"

  load()
}

load()
setInterval(load,30000)
</script>

</body>
</html>
