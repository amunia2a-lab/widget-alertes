<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertes Atelier</title>

<style>
*{box-sizing:border-box}

body{
  font-family: Inter, system-ui, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  background:transparent;
}

.widget{
  width:420px;
  padding:18px;
  border-radius:20px;
  border:1px solid rgba(0,0,0,0.08);
  background:white;
}

.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  font-weight:600;
}

.card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  margin-bottom:10px;
}

.left{
  display:flex;
  gap:10px;
  align-items:center;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.red{background:#e5484d;}
.orange{background:#f5a524;}
.green{background:#30a46c;}

.title{font-weight:600;}
.sub{font-size:12px;color:#666;}

button{
  border:1px solid rgba(0,0,0,0.1);
  background:white;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.form{
  display:flex;
  gap:6px;
  margin-top:12px;
  flex-wrap:nowrap;
}

.form input{
  flex:1;
  min-width:0;
}

.form select{
  width:100px;
}

.form button{
  width:70px;
}

input,select{
  padding:7px 8px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.1);
  background:white;
  font-size:13px;
}

.small{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

.empty{
  font-size:13px;
  color:#777;
  padding:10px 2px;
}
</style>
</head>

<body>

<div class="widget">

<div class="header">
<div>⚠️ Alertes atelier</div>
<div id="count">0</div>
</div>

<div id="list"></div>

<div class="form">
<input id="vehicule" placeholder="Véhicule">
<input id="alerte" placeholder="Alerte">
<select id="priorite">
<option>🔴</option>
<option>🟠</option>
<option>🟢</option>
</select>
<button onclick="add()">+</button>
</div>

<div class="small">Les alertes sont enregistrées dans Notion.</div>

</div>

<script>
const list = document.getElementById("list")
const count = document.getElementById("count")

function color(priority){
if(priority.includes("🔴")) return "red"
if(priority.includes("🟠")) return "orange"
return "green"
}

async function load(){
const res = await fetch("/.netlify/functions/alertes")
const data = await res.json()

count.textContent = data.length + (data.length > 1 ? " actives" : " active")

if(!data.length){
list.innerHTML = "<div class='empty'>Aucune alerte</div>"
return
}

list.innerHTML = data.map(a=>`
<div class="card">
<div class="left">
<div class="dot ${color(a.priorite)}"></div>
<div>
<div class="title">${a.vehicule} — ${a.alerte}</div>
<div class="sub">${a.priorite} • ${a.date}</div>
</div>
</div>
<button onclick="resolve('${a.id}')">Réglé</button>
</div>
`).join("")
}

async function resolve(id){
await fetch("/.netlify/functions/resolve",{
method:"POST",
body:JSON.stringify({id})
})
load()
}

async function add(){
const vehicule=document.getElementById("vehicule").value.trim()
const alerte=document.getElementById("alerte").value.trim()
const priorite=document.getElementById("priorite").value

if(!vehicule||!alerte) return

await fetch("/.netlify/functions/add",{
method:"POST",
body:JSON.stringify({vehicule,alerte,priorite})
})

document.getElementById("vehicule").value=""
document.getElementById("alerte").value=""

load()
}

load()
setInterval(load,30000)
</script>

</body>
</html>
