<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alertes atelier</title>
<style>
body{font-family:Inter,system-ui;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:transparent}
.widget{width:760px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:24px;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.title{font-size:26px;font-weight:700;display:flex;gap:10px;align-items:center}
.counters{display:flex;gap:18px;font-weight:700}
.counter{display:flex;gap:6px;align-items:center}
.circle{width:14px;height:14px;border-radius:50%;background:#e5484d}
.triangle{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #f5a524}
.square{width:14px;height:14px;background:#30a46c;border-radius:3px}
.panel{border:1px solid rgba(0,0,0,.08);border-radius:18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid rgba(0,0,0,.06);gap:12px}
.row:last-child{border-bottom:none}
.badge{padding:6px 12px;border-radius:999px;color:#fff;font-weight:700;margin-right:10px;margin-bottom:6px;
display:inline-block;}
.urgent{background:#e5484d}
.important{background:#f5a524}
.normal{background:#30a46c}
.form{display:flex;gap:10px;margin-bottom:12px}
.form input,.form select{height:48px;border:1px solid rgba(0,0,0,.1);border-radius:12px;padding:0 14px;font-size:16px}
.form input{flex:1}
.form select{width:160px}
button{height:48px;border-radius:12px;border:none;background:#2f6fc7;color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.resolve-btn{height:auto;border:1px solid rgba(0,0,0,.1);background:#fff;color:#1f1f1f;padding:10px 16px}
.footer{text-align:center;color:#666;font-size:14px}
.error{color:#c62828;font-size:13px;text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="widget">

<div class="header">
<div class="title">⚠️ Alertes atelier</div>
<div class="counters">
<div class="counter"><div class="circle"></div><span id="urgentCount">0</span></div>
<div class="counter"><div class="triangle"></div><span id="importantCount">0</span></div>
<div class="counter"><div class="square"></div><span id="normalCount">0</span></div>
</div>
</div>

<div class="panel" id="list"></div>

<div class="form">
<input id="vehicule" placeholder="Véhicule">
<input id="alerte" placeholder="Alerte">
<select id="priorite">
<option>🔴 Urgent</option>
<option>🟠 Important</option>
<option>🟢 Normal</option>
</select>
<button onclick="addAlert()">Ajouter</button>
</div>

<div class="footer">Les alertes sont enregistrées dans Notion.</div>
<div class="error" id="error"></div>

</div>

<script>
const listEl = document.getElementById("list");
const errorEl = document.getElementById("error");

function formatDate(d){
  if(!d) return "";
  const date=new Date(d);
  const day=String(date.getDate()).padStart(2,"0");
  const month=String(date.getMonth()+1).padStart(2,"0");
  const year=date.getFullYear();
  return `${day}-${month}-${year}`;
}

function badge(p){
  if(p.includes("Urgent")) return "badge urgent";
  if(p.includes("Important")) return "badge important";
  return "badge normal";
}

async function load(){
  errorEl.textContent = "";
  const res=await fetch("/api/alertes");
  const data=await res.json();

  let u=0,i=0,n=0;
  data.forEach(a=>{
    if(a.priorite.includes("Urgent"))u++;
    else if(a.priorite.includes("Important"))i++;
    else n++;
  });

  urgentCount.textContent=u;
  importantCount.textContent=i;
  normalCount.textContent=n;

  if(!data.length){
    listEl.innerHTML = '<div style="padding:16px;color:#666">Aucune alerte en cours</div>';
    return;
  }

  listEl.innerHTML=data.map(a=>`
  <div class="row">
    <div>
      <span class="${badge(a.priorite)}">${a.priorite.replace(/^.. /,'')}</span>
      <b>${a.vehicule} — ${a.alerte}</b><br>
      ${a.priorite.replace(/^.. /,'')} • ${formatDate(a.date)}
    </div>
    <button class="resolve-btn" onclick="resolveAlert('${a.id}')">Réglé</button>
  </div>
  `).join("");
}

async function resolveAlert(id){
  errorEl.textContent = "";
  const res = await fetch("/api/resolve",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    errorEl.textContent = data.error || "Impossible de marquer comme réglé.";
    return;
  }
  load();
}

async function addAlert(){
  errorEl.textContent = "";
  const vehicule=document.getElementById("vehicule").value.trim();
  const alerte=document.getElementById("alerte").value.trim();
  const priorite=document.getElementById("priorite").value;

  if(!vehicule||!alerte){
    errorEl.textContent = "Renseigne le véhicule et l'alerte.";
    return;
  }

  const res = await fetch("/api/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({vehicule,alerte,priorite})
  });

  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    errorEl.textContent = data.error || "Impossible d'ajouter l'alerte.";
    return;
  }

  document.getElementById("vehicule").value="";
  document.getElementById("alerte").value="";

  load();
}

load();
setInterval(load,30000);
</script>

</body>
</html>
