
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertes Atelier</title>

<style>
body{
font-family: Inter, system-ui, -apple-system, sans-serif;
background: transparent;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.widget{
width:420px;
padding:18px;
border-radius:20px;
border:1px solid rgba(0,0,0,0.08);
background:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
margin-bottom:14px;
}

.card{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border:1px solid rgba(0,0,0,0.08);
border-radius:14px;
margin-bottom:10px;
}

.left{
display:flex;
gap:10px;
align-items:center;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
}

.red{background:#e5484d;}
.orange{background:#f5a524;}
.green{background:#30a46c;}

.title{
font-weight:600;
}

.sub{
font-size:12px;
color:#666;
}

.empty{
font-size:13px;
color:#777;
padding:10px;
}
</style>
</head>

<body>

<div class="widget">

<div class="header">
<div>⚠️ Alertes atelier</div>
<div id="count">0</div>
</div>

<div id="list"></div>

</div>

<script>

const list = document.getElementById("list")
const count = document.getElementById("count")

function color(priority){

if(priority.includes("Urgent")) return "red"
if(priority.includes("Important")) return "orange"
return "green"

}

async function load(){

try{

const res = await fetch("/.netlify/functions/alertes")
const data = await res.json()

count.textContent = data.length + " actives"

if(!data.length){

list.innerHTML = "<div class='empty'>Aucune alerte en cours</div>"
return

}

list.innerHTML = data.map(a=>{

return `
<div class="card">

<div class="left">

<div class="dot ${color(a.priorite)}"></div>

<div>
<div class="title">${a.vehicule} — ${a.alerte}</div>
<div class="sub">${a.priorite} • ${a.date}</div>
</div>

</div>

</div>
`

}).join("")

}catch(e){

list.innerHTML = "<div class='empty'>Erreur chargement</div>"

}

}

load()
setInterval(load,30000)

</script>

</body>
</html>
